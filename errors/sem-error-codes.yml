format: xiaoe-code-msg-data
description: >-
  Xiaoe Open API global return codes. The response envelope is
  {code, msg, data}: code 0 = success, code < 0 = system-level errors
  (signature / permission / credential), code > 0 = business-logic errors.
  Codes below captured verbatim from the global return-code reference.
envelope:
  code: integer status indicator (0 success)
  msg: human-readable message
  data: response payload object
categories:
  success: code == 0
  system_error: code < 0 (signatures, credentials, permissions)
  business_error: code > 0 (business logic)
