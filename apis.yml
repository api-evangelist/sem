apis:
- name: Xiaoe Open API
  description: >-
    Xiaoe's Open API (开放API) for integrating store data and operations —
    users, products, orders, refunds, live broadcasts, learning/course data,
    marketing (coupons, group-buy, promoters) and points — into third-party
    systems. Uses access_token auth (GET /token with app_id, client_id,
    secret_key, grant_type=client_credential; 2h TTL) and a code/msg/data
    response envelope.
