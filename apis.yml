aid: sem
name: Xiaoe (小鹅通)
description: >-
  Xiaoe (小鹅通), operated by Shenzhen Xiaoe Network Technology Co., Ltd., is a
  Chinese private-domain (私域) marketing and content-commerce SaaS platform that
  helps businesses convert public-channel audiences into owned WeChat-based
  channels. Its product suite spans knowledge/course delivery, live-streaming
  e-commerce, a mini-program mall, enterprise SCRM, training academies, community
  circles, points/loyalty, and promoter (affiliate) programs across 20+
  industries. Xiaoe exposes an Open API (开放API) at api.xiaoe-tech.com covering
  users, products, orders, payments, live broadcasts, learning data, marketing
  and points, using access_token authentication, a code/msg/data response
  envelope, and an encrypted message-push (webhook) event system. The "sem"
  subdomain is Xiaoe's search-marketing landing surface; the company was
  surfaced as a portfolio company of Qiming Venture Partners.
